<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<title>AMI 보강공사</title>
<style>
/* ── 토큰 ── */
:root{
  --bg:#f5f6f8;--card:#fff;--line:#e4e6eb;--ink:#1a1b1e;--ink2:#6b7280;--mute:#9ca3af;
  --navy:#1d4ed8;--navy-dk:#1e3a8a;--red:#dc2626;
  --done:#16a34a;--done-bg:#dcfce7;--done-fg:#15803d;
  --undone:#ea580c;--undone-bg:#ffedd5;--undone-fg:#c2410c;
  --todo:#9ca3af;--todo-bg:#f3f4f6;
  --road:#0891b2;--roadbg:#e0f2fe;
  --kakao:#FEE500;--tmap:#2563eb;
  --radius:14px;--radius-sm:8px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318;--card:#1c1e24;--line:#2a2d35;--ink:#f0f1f3;--ink2:#9ba3b2;--mute:#5a6070;
  --navy:#3b82f6;--navy-dk:#2563eb;--red:#f87171;
  --done:#4ade80;--done-bg:#052e16;--done-fg:#4ade80;
  --undone:#fb923c;--undone-bg:#431407;--undone-fg:#fb923c;
  --todo:#4b5563;--todo-bg:#1f2937;
  --road:#22d3ee;--roadbg:#0c4a6e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111318;--card:#1c1e24;--line:#2a2d35;--ink:#f0f1f3;--ink2:#9ba3b2;--mute:#5a6070;
  --navy:#3b82f6;--navy-dk:#2563eb;--red:#f87171;
  --done:#4ade80;--done-bg:#052e16;--done-fg:#4ade80;
  --undone:#fb923c;--undone-bg:#431407;--undone-fg:#fb923c;
  --todo:#4b5563;--todo-bg:#1f2937;
  --road:#22d3ee;--roadbg:#0c4a6e;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
a{color:var(--navy);text-decoration:none}
.hide{display:none!important}

/* ── 상단 헤더 ── */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:0 16px}
.hbar{display:flex;align-items:center;gap:10px;height:52px}
.hbar .logo{font-size:17px;font-weight:900;color:var(--navy);letter-spacing:-.3px;flex:1}
.hbar .logo small{font-weight:700;font-size:11px;color:var(--mute);margin-left:6px;vertical-align:1px}
.hbar .who{font-size:13px;font-weight:700;color:var(--ink2)}
.hbar .btn-sm{border:1.5px solid var(--line);background:transparent;color:var(--ink2);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;font-weight:700}
.hbar .btn-sm:active{opacity:.7}
.pend{font-size:12px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:8px;padding:5px 10px;margin-bottom:6px}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:700;padding:10px 14px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:800}

/* ── 공통 ── */
main{padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card + .card{margin-top:0}
.muted{color:var(--mute);font-size:12.5px}
.spin{text-align:center;color:var(--mute);padding:40px 0;font-weight:700}
h2{font-size:14px;font-weight:800;color:var(--ink2);margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:8px}

/* ── 로그인 ── */
.login{max-width:400px;margin:48px auto;padding:0 16px}
.login .brand{font-size:26px;font-weight:900;color:var(--navy);margin-bottom:4px}
.login .sub{font-size:13px;color:var(--mute);margin-bottom:28px}
.login label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;margin-top:14px}
.login select,.login input{width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;-webkit-appearance:none}
.login select:focus,.login input:focus{outline:none;border-color:var(--navy)}
.btn-primary{width:100%;border:0;background:var(--navy);color:#fff;font-size:16px;font-weight:800;padding:15px;border-radius:13px;margin-top:16px;letter-spacing:.2px}
.btn-primary:active{opacity:.85}

/* ── 진행바 ── */
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--todo-bg);margin-top:8px}
.bar i{display:block;height:100%;transition:width .3s}
.bar .d{background:var(--done)} .bar .u{background:var(--undone)}

/* ── 타입 뱃지 ── */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;margin-right:4px;letter-spacing:.2px;white-space:nowrap}
.badge.lte-a{background:#ede9fe;color:#6d28d9}
.badge.lte-e{background:#fce7f3;color:#be185d}
.badge.lte-g{background:#e0f2fe;color:#0369a1}
.badge.smgw{background:#dcfce7;color:#15803d}
.badge.amigo{background:#fef9c3;color:#92400e}
.badge.etc{background:var(--todo-bg);color:var(--ink2)}

/* ── 상태 칩 ── */
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;border-radius:20px;padding:3px 10px}
.chip.done{background:var(--done-bg);color:var(--done-fg)}
.chip.undone{background:var(--undone-bg);color:var(--undone-fg)}
.chip.todo{background:var(--todo-bg);color:var(--ink2)}

/* ── 대시보드 ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi-grid.three{grid-template-columns:repeat(3,1fr)}
.kpi-box{background:var(--bg);border-radius:10px;padding:11px 12px}
.kpi-box .lbl{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.kpi-box .val{font-size:24px;font-weight:900;line-height:1.1;margin-top:3px}
.kpi-box .val small{font-size:13px;font-weight:700;color:var(--ink2)}
.kpi-box.hi .val{color:var(--done)}
.kpi-box.hi2 .val{color:var(--undone)}
.gap-bar{font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;margin-top:8px}
.gap-bar.ahead{background:#dcfce7;color:#15803d}
.gap-bar.behind{background:#ffedd5;color:#c2410c}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.prow .t{font-weight:800;font-size:15px}
.prow .n{font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.hb{margin:8px 0}
.hb .prow .t{font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
td:first-child,th:first-child{text-align:left}
th{font-weight:700;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
details summary{font-weight:700;color:var(--ink2);font-size:13px;cursor:pointer;padding:6px 0}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:6px;flex-wrap:wrap}
.lg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;
  box-shadow:0 4px 18px rgba(0,0,0,.15);white-space:nowrap;display:none;z-index:2}

/* ── 목록 공통 ── */
.back{border:0;background:none;color:var(--navy);font-size:14px;font-weight:700;padding:6px 0;display:flex;align-items:center;gap:4px}
.srch-wrap{position:relative;margin:8px 0}
.srch-wrap input{width:100%;font-size:15px;padding:11px 40px 11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit}
.srch-wrap input:focus{outline:none;border-color:var(--navy)}
.srch-wrap .ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:16px;pointer-events:none}
.flt{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:8px 0}
.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap}
.flt button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── 동 목록 ── */
.area-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.area-card:active{border-color:var(--navy)}
.area-card .ai{flex:1;min-width:0}
.area-card .sigu{font-size:11.5px;font-weight:700;color:var(--mute)}
.area-card .dong{font-size:16px;font-weight:800;margin-top:2px}
.area-card .stats{font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;text-align:right}
.area-card .pct-big{font-size:18px;font-weight:900;color:var(--navy)}
.area-card .chevron{color:var(--mute);font-size:18px}

/* ── 내 작업 (내 진행) 카드 ── */
.me-card{text-align:center;padding:20px 14px}
.me-card .pct-hero{font-size:48px;font-weight:900;color:var(--navy);line-height:1}
.me-card .pct-hero small{font-size:18px;font-weight:700}
.me-card .sub{font-size:13px;color:var(--ink2);font-weight:700;margin-top:6px}

/* ── 주소 그룹 ── */
.rdh{font-size:12px;font-weight:800;color:var(--mute);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.rdh::after{content:'';flex:1;height:1px;background:var(--line)}
.addr-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.addr-head{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.addr-jb{font-size:16px;font-weight:900}
.addr-ra{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:700;color:var(--road);cursor:pointer}
.addr-ra .btn-copy{border:1.5px solid var(--road);background:transparent;color:var(--road);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;flex:none}
.addr-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.addr-nav{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.addr-nav button{border:0;border-radius:9px;padding:10px 0;font-size:13px;font-weight:800}
.nav-k{background:var(--kakao);color:#3a1d1d}
.nav-t{background:var(--tmap);color:#fff}
.nav-all{background:var(--navy);color:#fff}

/* ── 계기 행 ── */
.meter-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.meter-row:last-child{border-bottom:0}
.meter-info{flex:1;min-width:0}
.meter-num{font-size:14.5px;font-weight:900;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.meter-num b{color:var(--navy)}
.meter-meta{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.meter-reason{font-size:12px;color:var(--undone-fg);font-weight:700;margin-top:3px;background:var(--undone-bg);border-radius:5px;padding:2px 7px;display:inline-block}
.meter-btns{display:flex;gap:5px;flex:none}
.sb{border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;white-space:nowrap;min-width:52px;text-align:center}
.sb.on-d{background:var(--done);border-color:var(--done);color:#fff}
.sb.on-u{background:var(--undone);border-color:var(--undone);color:#fff}

/* ── 더보기 ── */
.more{width:100%;border:1.5px dashed var(--line);background:none;color:var(--ink2);padding:14px;border-radius:var(--radius);font-weight:800;margin-top:4px}

/* ── 사유 모달 ── */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:17px;font-weight:900}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rgrid button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 0;font-size:13.5px;font-weight:700}
.rgrid button.on{background:var(--undone);border-color:var(--undone);color:#fff}
.sheet input{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;background:var(--bg);color:var(--ink);font-family:inherit}
.sheet input:focus{outline:none;border-color:var(--navy)}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;border:0;border-radius:12px;padding:14px 0;font-size:15px;font-weight:800}
.b2{background:var(--bg);color:var(--ink2)} .b1{background:var(--undone);color:#fff}

/* ── 지도 ── */
body.mapmode main{padding:0}
#mapWrap{position:fixed;left:0;right:0;bottom:0;top:var(--topH,110px);display:flex;flex-direction:column}
.mbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mbar select{font-size:13.5px;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700}
.mbar .toggle-tile{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.mbar .toggle-tile button{border:0;background:var(--card);color:var(--ink2);font-size:12px;font-weight:700;padding:6px 10px}
.mbar .toggle-tile button.on{background:var(--navy);color:#fff}
.mlg{display:flex;gap:10px;font-size:12px;font-weight:700;color:var(--ink2);flex-wrap:wrap}
.mlg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.2)}
.mbar .sum{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink2);text-align:right;line-height:1.4;white-space:nowrap}
#map{flex:1;background:#e8eaee}
.fab{position:absolute;right:12px;z-index:500;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.25);color:var(--ink)}
.pop b{font-size:15px;font-weight:900}
.pop .r{color:var(--road);font-weight:700;margin-top:3px;font-size:13px}
.pop .c{margin-top:5px;font-weight:700;font-size:13px}
.pop .pb{display:flex;gap:6px;margin-top:10px}
.pop .pb button{flex:1;border:0;border-radius:9px;padding:10px 6px;font-weight:800;font-size:13px}
.leaflet-popup-content{margin:12px 14px;min-width:220px;font-family:inherit}

/* ── 지도 타입 마커 ── */
.type-marker{background:transparent;border:0}
.tm-inner{font-size:10.5px;font-weight:900;border-radius:7px;padding:3px 7px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;letter-spacing:.3px}
.tm-inner.lte-a{background:#7c3aed;color:#fff}
.tm-inner.lte-e{background:#be185d;color:#fff}
.tm-inner.lte-g{background:#0369a1;color:#fff}
.tm-inner.smgw{background:#15803d;color:#fff}
.tm-inner.amigo{background:#92400e;color:#fff}
.tm-done{opacity:.45}
.tm-undone .tm-inner{box-shadow:0 2px 8px rgba(234,88,12,.6),0 0 0 2px #ea580c}

/* ── 작업자 카드 ── */
.worker-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.worker-card:active{border-color:var(--navy)}
.worker-icon{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.worker-card .wi{flex:1}
.worker-card .wname{font-size:15px;font-weight:800}

/* ── 자재 ── */
.matl-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.matl-kpi .mk{text-align:center;border-radius:10px;padding:12px 8px}
.matl-kpi .mk .mv{font-size:20px;font-weight:900}
.matl-kpi .mk .ml{font-size:11px;font-weight:700;margin-top:3px}
.stock-bar{background:var(--line);border-radius:4px;height:7px;overflow:hidden;margin-top:4px}
.stock-bar .fill{height:7px;border-radius:4px;transition:width .3s}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.form-group select,.form-group input{width:100%;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit}
.form-group select:focus,.form-group input:focus{outline:none;border-color:var(--navy)}

/* ── 토스트 ── */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(0);background:var(--ink);color:var(--card);font-size:14px;font-weight:700;
  padding:11px 18px;border-radius:24px;opacity:0;transition:.2s;pointer-events:none;z-index:80;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="vLogin" class="login hide">
  <div class="brand">⚡ AMI 보강공사</div>
  <div class="sub">2권역 모뎀 설치 공정관리 · 2026.10 ~ 2027.03</div>
  <label>이름 선택</label>
  <select id="lName"><option value="">불러오는 중…</option></select>
  <label>PIN 번호</label>
  <input id="lPin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN 4자리">
  <button class="btn-primary" onclick="doLogin()">들어가기</button>
  <div class="err" id="lErr"></div>
</div>

<!-- 앱 -->
<div id="vApp" class="hide">
  <header>
    <div class="hbar">
      <div class="logo">⚡ AMI<small>보강공사</small></div>
      <span class="who" id="hWho"></span>
      <button class="btn-sm" onclick="logout()">나가기</button>
    </div>
    <div class="pend hide" id="hPend"></div>
    <div class="tabs" id="hTabs">
      <button id="tDash" class="on" onclick="go('dash')">📊 공정률</button>
      <button id="tWork" onclick="go('work')">👷 작업자</button>
      <button id="tList" onclick="go('areas')">📋 내 작업</button>
      <button id="tMap" onclick="go('map')">🗺️ 지도</button>
      <button id="tMatl" onclick="go('matl')">📦 자재</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>/* ── 기본 ── */
const REASONS = ['부재(고객없음)', '고객거부', '설치공간없음', '통신불량', '계기교체필요', '출입불가', '기타'];
const LSK = 'ami_boost_v2';
let U = null;
let S = {
  view: '',
  who: '',
  areas: [],
  area: null,
  rows: [],
  flt: 'todo',
  q: '',
  shown: 60,
  dimKey: 'worker',
  mapWho: '*',
  mapFlt: 'left',
  tileMode: 'normal'
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({
  '<': '&lt;',
  '>': '&gt;',
  '&': '&amp;',
  '"': '&quot;',
  "'": '&#39;'
})[c]);
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const pct = (a, b) => b ? a / b * 100 : 0;
function ls(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(LSK + k) || 'null');
    localStorage.setItem(LSK + k, JSON.stringify(v));
  } catch (e) {
    return null;
  }
}
function toast(m) {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 1700);
}
function call(fn, ...a) {
  return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
}
function stamp() {
  const d = new Date(),
    p = n => String(n).padStart(2, '0');
  return "".concat(d.getFullYear(), "-").concat(p(d.getMonth() + 1), "-").concat(p(d.getDate()), " ").concat(p(d.getHours()), ":").concat(p(d.getMinutes()));
}
function copy(t) {
  const fb = () => {
    const a = document.createElement('textarea');
    a.value = t;
    document.body.appendChild(a);
    a.select();
    try {
      document.execCommand('copy');
      toast('📋 복사됨');
    } catch (e) {}
    a.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('📋 복사됨')).catch(fb);else fb();
}
function openUrl(u) {
  const a = document.createElement('a');
  a.href = u;
  a.target = u.startsWith('http') ? '_blank' : '_top';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function bar(d, u, t) {
  return "<div class=\"bar\">".concat(d ? "<i class=\"d\" style=\"width:".concat(pct(d, t), "%\"></i>") : '').concat(u ? "<i class=\"u\" style=\"width:".concat(pct(u, t), "%\"></i>") : '', "</div>");
}

/* 계기 타입 → 클래스 */
function tyClass(ty) {
  const t = String(ty || '').toUpperCase();
  if (t.includes('LTE') && t.includes('A')) return 'lte-a';
  if (t.includes('LTE') && t.includes('E')) return 'lte-e';
  if (t.includes('LTE') && t.includes('G')) return 'lte-g';
  if (t.includes('SMGW')) return 'smgw';
  if (t.includes('AMIGO')) return 'amigo';
  return 'etc';
}
function tyLabel(ty) {
  const t = String(ty || '').toUpperCase();
  if (t.includes('LTE') && t.includes('A')) return 'LTE(A)';
  if (t.includes('LTE') && t.includes('E')) return 'LTE(E)';
  if (t.includes('LTE') && t.includes('G')) return 'LTE(G)';
  if (t.includes('SMGW')) return 'SMGW';
  if (t.includes('AMIGO')) return 'AMIGO';
  return ty || '';
}

/* ── 로그인 ── */
async function boot() {
  const saved = ls('user');
  if (saved) {
    try {
      U = Object.assign(await call('login', saved.name, saved.pin), {
        pin: saved.pin
      });
      return enter();
    } catch (e) {}
  }
  showLogin();
}
async function showLogin() {
  $('vApp').classList.add('hide');
  $('vLogin').classList.remove('hide');
  try {
    const ns = await call('loginNames');
    $('lName').innerHTML = '<option value="">이름 선택</option>' + ns.map(n => "<option>".concat(esc(n), "</option>")).join('');
  } catch (e) {
    $('lErr').textContent = '서버 연결 실패 — 새로고침 해주세요';
  }
}
async function doLogin() {
  const n = $('lName').value,
    p = $('lPin').value.trim();
  $('lErr').textContent = '';
  if (!n || !p) {
    $('lErr').textContent = '이름과 PIN을 입력해주세요';
    return;
  }
  try {
    U = Object.assign(await call('login', n, p), {
      pin: p
    });
    ls('user', {
      name: n,
      pin: p
    });
    enter();
  } catch (e) {
    $('lErr').textContent = e && e.message || '로그인 실패';
  }
}
function logout() {
  if (!confirm('로그아웃할까요?')) return;
  ls('user', null);
  U = null;
  location.reload();
}
function enter() {
  $('vLogin').classList.add('hide');
  $('vApp').classList.remove('hide');
  $('hWho').textContent = U.name + (U.role === 'admin' ? ' 관리자' : '');
  const ad = U.role === 'admin';
  $('tDash').classList.toggle('hide', !ad);
  $('tWork').classList.toggle('hide', !ad);
  $('tList').classList.toggle('hide', ad);
  $('tMatl').classList.remove('hide');
  if (ad) {
    S.mapWho = '*';
    go('dash');
  } else {
    S.who = U.name;
    S.mapWho = U.name;
    go('areas');
  }
  flush();
  renderPend();
}
function go(v) {
  if (v === 'matl') {
    ['tDash', 'tWork', 'tList', 'tMap', 'tMatl'].forEach(id => $(id).classList.toggle('on', id === 'tMatl'));
    document.body.classList.remove('mapmode');
    return loadMatl();
  }
  const tab = {
    dash: 'tDash',
    work: 'tWork',
    areas: U.role === 'admin' ? 'tWork' : 'tList',
    map: 'tMap'
  }[v];
  ['tDash', 'tWork', 'tList', 'tMap', 'tMatl'].forEach(id => $(id).classList.toggle('on', id === tab));
  document.body.classList.toggle('mapmode', v === 'map');
  if (v === 'dash') return loadDash();
  if (v === 'work') return showWorkers();
  if (v === 'areas') return loadAreas();
  if (v === 'map') return showMap();
}

/* ── 오프라인 대기열 ── */
function queue() {
  return ls('q') || [];
}
function renderPend() {
  const n = queue().length;
  $('hPend').classList.toggle('hide', !n);
  $('hPend').textContent = "⏳ 전송 대기 ".concat(n, "건 — 신호 잡히면 자동 전송");
}
let flushing = false;
async function flush() {
  if (flushing || !U) return;
  const q = queue();
  if (!q.length) return renderPend();
  flushing = true;
  let sent = false;
  try {
    const r = await call('update', U.name, U.pin, q);
    ls('q', queue().slice(q.length));
    sent = true;
    if (r.ok < q.length) toast("⚠️ ".concat(q.length - r.ok, "건 저장 안 됨"));
  } catch (e) {}
  flushing = false;
  renderPend();
  if (sent && queue().length) flush();
}
setInterval(flush, 20000);
window.addEventListener('online', flush);
async function save(items) {
  items.forEach(it => it.at = stamp());
  ls('q', queue().concat(items));
  renderPend();
  await flush();
}

/* ── 지도 ── */
const PC = {
  todo: '#dc2626',
  undone: '#ea580c',
  done: '#16a34a'
};
let MAP = null,
  NORM_LAYER = null,
  SAT_LAYER = null,
  LAYER = null,
  MP = [],
  ME = null;
function pState(p) {
  return p[5] >= p[4] ? 'done' : p[6] ? 'undone' : 'todo';
}
async function showMap() {
  S.view = 'map';
  window.scrollTo(0, 0);
  const sel = U.role === 'admin' ? "<select onchange=\"S.mapWho=this.value;loadMap()\"><option value=\"*\">전체 작업자</option>".concat(U.workers.map(w => "<option ".concat(S.mapWho === w ? 'selected' : '', ">").concat(esc(w), "</option>")).join(''), "</select>") : '';
  if (!window._mapInited) {
    $('main').innerHTML = "<div id=\"mapWrap\">\n    <div class=\"mbar\">\n      ".concat(sel, "\n      <select onchange=\"S.mapFlt=this.value;drawPts()\">\n        <option value=\"left\">남은 곳만</option>\n        <option value=\"all\" ").concat(S.mapFlt === 'all' ? 'selected' : '', ">전체</option>\n      </select>\n      <div class=\"toggle-tile\">\n        <button id=\"tileNorm\" class=\"").concat(S.tileMode === 'normal' ? 'on' : '', "\" onclick=\"setTile('normal')\">일반</button>\n        <button id=\"tileSat\" class=\"").concat(S.tileMode === 'satellite' ? 'on' : '', "\" onclick=\"setTile('satellite')\">위성</button>\n      </div>\n      <div class=\"mlg\">\n        <span><i style=\"background:").concat(PC.todo, "\"></i>남음</span>\n        <span><i style=\"background:").concat(PC.undone, "\"></i>미완료</span>\n        <span><i style=\"background:").concat(PC.done, "\"></i>완료</span>\n      </div>\n      <div class=\"sum\" id=\"mSum\"></div>\n    </div>\n    <div style=\"position:relative;flex:1;display:flex\">\n      <div id=\"map\"></div>\n      <button class=\"fab\" style=\"bottom:70px\" onclick=\"locate()\">📍</button>\n      <button class=\"fab\" style=\"bottom:14px\" onclick=\"fitPts()\">⤢</button>\n    </div>\n  </div>");
  }
  const h = document.querySelector('header').getBoundingClientRect().bottom;
  document.documentElement.style.setProperty('--topH', h + 'px');
  if (!window.L) {
    $('mSum').textContent = '지도 라이브러리 로드 실패';
    return;
  }
  if (!window._mapInited) {
    MAP = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      preferCanvas: true
    }).setView([37.36, 126.88], 11);
    NORM_LAYER = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    });
    SAT_LAYER = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18
    });
    if (S.tileMode === 'satellite') SAT_LAYER.addTo(MAP); else NORM_LAYER.addTo(MAP);
    LAYER = L.layerGroup().addTo(MAP);
    ME = null;
    window._mapInited = true;
    loadMap();
  } else {
    MAP.invalidateSize();
  }
}
function setTile(mode) {
  S.tileMode = mode;
  $('tileNorm').classList.toggle('on', mode === 'normal');
  $('tileSat').classList.toggle('on', mode === 'satellite');
  if (!MAP) return;
  if (mode === 'satellite') {
    MAP.removeLayer(NORM_LAYER);
    SAT_LAYER.addTo(MAP);
  } else {
    MAP.removeLayer(SAT_LAYER);
    NORM_LAYER.addTo(MAP);
  }
}
async function loadMap() {
  $('mSum').textContent = '불러오는 중…';
  try {
    const r = await call('mapPoints', U.name, U.pin, S.mapWho || '*');
    MP = r.pts;
    S.mapMissing = r.missing;
    drawPts();
    fitPts();
  } catch (e) {
    $('mSum').textContent = '⚠️ ' + (e.message || e);
  }
}
function makeTypeIcon(ty, state) {
  const cls = tyClass(ty),
    lbl = tyLabel(ty);
  const el = document.createElement('div');
  el.className = 'type-marker';
  el.innerHTML = "<div class=\"tm-inner ".concat(cls, "\">").concat(esc(lbl), "</div>");
  if (state === 'done') el.firstChild.classList.add('tm-done');
  if (state === 'undone') el.classList.add('tm-undone');
  const sz = lbl.length > 5 ? [58, 24] : [48, 22];
  return L.divIcon({
    html: el.outerHTML,
    className: '',
    iconSize: sz,
    iconAnchor: [sz[0] / 2, sz[1] / 2]
  });
}
function drawPts() {
  if (!LAYER) return;
  LAYER.clearLayers();
  const flt = S.mapFlt || 'left';
  let shown = 0,
    left = 0;
  MP.forEach((p, i) => {
    const st = pState(p);
    if (st !== 'done') left++;
    if (flt === 'left' && st === 'done') return;
    shown++;
    const ty = p[10] || '';
    const icon = makeTypeIcon(ty, st);
    L.marker([p[0], p[1]], {
      icon
    }).on('click', () => popPt(i)).addTo(LAYER);
  });
  $('mSum').innerHTML = "남은 주소 <b>".concat(fmt(left), "</b> / ").concat(fmt(MP.length), "곳") + (S.mapMissing ? "<br>좌표없음 ".concat(fmt(S.mapMissing), "대") : '');
  if (!MP.length && S.mapMissing) $('mSum').innerHTML = '좌표가 아직 없어요<br>시트 메뉴 → 좌표 채우기';
}
function fitPts() {
  if (!MAP || !MP.length) return;
  const b = L.latLngBounds(MP.map(p => [p[0], p[1]]));
  MAP.fitBounds(b, {
    padding: [30, 30],
    maxZoom: 17
  });
}
function popPt(i) {
  const p = MP[i],
    left = p[4] - p[5] - p[6];
  const ty = p[10] || '';
  const cls = tyClass(ty);
  const lbl = tyLabel(ty);
  L.popup().setLatLng([p[0], p[1]]).setContent("<div class=\"pop\">\n    <b>".concat(esc(p[2]), "</b>\n    ").concat(p[3] ? "<div class=\"r\">🛣️ ".concat(esc(p[3]), "</div>") : '', "\n    <div style=\"margin-top:5px\"><span class=\"badge ").concat(cls, "\">").concat(esc(lbl), "</span></div>\n    <div class=\"c\">계기 ").concat(p[4], "대 · 완료 ").concat(p[5], " · 미완료 ").concat(p[6], " · 남음 ").concat(left, "</div>\n    ").concat(U.role === 'admin' ? "<div class=\"muted\" style=\"margin-top:4px\">👷 ".concat(esc(p[9]), "</div>") : '', "\n    <div class=\"pb\">\n      <button style=\"background:var(--kakao);color:#3a1d1d\" onclick=\"navK(MP[").concat(i, "][3]||MP[").concat(i, "][2])\">🗺️ 길안내</button>\n      <button style=\"background:var(--navy);color:#fff\" onclick=\"openFromMap(").concat(i, ")\">📋 계기 보기</button>\n    </div></div>")).openOn(MAP);
}
async function openFromMap(i) {
  const p = MP[i];
  S.who = p[9];
  document.body.classList.remove('mapmode');
  ['tDash', 'tWork', 'tList', 'tMap'].forEach(id => $(id).classList.toggle('on', id === (U.role === 'admin' ? 'tWork' : 'tList')));
  $('main').innerHTML = '<div class="spin">불러오는 중…</div>';
  try {
    const r = await call('myAreas', U.name, U.pin, S.who);
    S.areas = r.areas;
    const k = S.areas.findIndex(a => a.sigu === p[7] && a.dong === p[8]);
    if (k < 0) {
      renderAreas();
      return;
    }
    await openArea(k);
    S.q = p[2];
    S.flt = 'all';
    renderRows();
  } catch (e) {
    toast(e.message || '실패');
  }
}
function locate() {
  if (!navigator.geolocation) {
    toast('위치 기능 없음');
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (ME) MAP.removeLayer(ME);
    ME = L.circleMarker(ll, {
      radius: 9,
      color: '#fff',
      weight: 3,
      fillColor: '#16a34a',
      fillOpacity: 1
    }).addTo(MAP);
    MAP.setView(ll, 16);
  }, () => toast('위치 권한이 막혀 있어요'), {
    enableHighAccuracy: true,
    timeout: 8000
  });
}

/* ── 관리자: 작업자 고르기 ── */
function showWorkers() {
  S.view = 'work';
  $('main').innerHTML = "<div class=\"card\"><h2>작업자 선택</h2><p class=\"muted\" style=\"margin:0\">작업자 화면을 그대로 보고 대신 처리할 수 있어요</p></div>" + U.workers.map((w, i) => "<div class=\"worker-card\" onclick=\"S.who=U.workers[".concat(i, "];loadAreas()\">\n      <div class=\"worker-icon\">👷</div>\n      <div class=\"wi\"><div class=\"wname\">").concat(esc(w), "</div></div>\n      <span class=\"chevron\">›</span>\n    </div>")).join('');
}

/* ── 담당 동 목록 ── */
async function loadAreas() {
  S.view = 'areas';
  $('main').innerHTML = '<div class="spin">불러오는 중…</div>';
  try {
    const r = await call('myAreas', U.name, U.pin, S.who);
    S.areas = r.areas;
    renderAreas();
  } catch (e) {
    $('main').innerHTML = "<div class=\"card\">⚠️ ".concat(esc(e.message || e), "</div>");
  }
}
function renderAreas() {
  const t = S.areas.reduce((a, x) => a + x.total, 0),
    d = S.areas.reduce((a, x) => a + x.done, 0),
    u = S.areas.reduce((a, x) => a + x.undone, 0);
  $('main').innerHTML = (U.role === 'admin' ? "<button class=\"back\" onclick=\"go('work')\">‹ 작업자 목록</button>" : '') + "<div class=\"card me-card\">\n      <div class=\"muted\" style=\"margin-bottom:8px\">".concat(esc(S.who), " 님 담당</div>\n      <div class=\"pct-hero\">").concat(pct(d, t).toFixed(1), "<small>%</small></div>\n      ").concat(bar(d, u, t), "\n      <div class=\"sub\" style=\"margin-top:10px\">완료 ").concat(fmt(d), " · 미완료 ").concat(fmt(u), " · 남은 ").concat(fmt(t - d - u), "대</div>\n    </div>\n    <div class=\"srch-wrap\">\n      <input placeholder=\"계기번호·주소 검색\" onkeydown=\"if(event.key==='Enter')doSearch(this.value)\">\n      <span class=\"ico\">🔎</span>\n    </div>\n    <div style=\"font-size:12px;font-weight:800;color:var(--mute);margin:10px 0 6px\">담당 지역 ").concat(S.areas.length, "개 동</div>") + S.areas.map((a, i) => "<div class=\"area-card\" onclick=\"openArea(".concat(i, ")\">\n      <div class=\"ai\">\n        <div class=\"sigu\">").concat(esc(a.sigu), "</div>\n        <div class=\"dong\">").concat(esc(a.dong), "</div>\n        ").concat(bar(a.done, a.undone, a.total), "\n        ").concat(a.undone ? "<div class=\"muted\" style=\"margin-top:5px;font-size:12px\">미완료 ".concat(a.undone, "대</div>") : '', "\n      </div>\n      <div>\n        <div class=\"pct-big\">").concat(pct(a.done, a.total).toFixed(0), "%</div>\n        <div class=\"stats\">").concat(fmt(a.done), " / ").concat(fmt(a.total), "</div>\n      </div>\n      <span class=\"chevron\">›</span>\n    </div>")).join('') + (S.areas.length ? '' : "<div class=\"card muted\">배정된 작업이 없어요. 관리자에게 문의하세요.</div>");
}
async function doSearch(q) {
  if (String(q).trim().length < 2) {
    toast('2글자 이상 입력해주세요');
    return;
  }
  $('main').innerHTML = '<div class="spin">검색 중…</div>';
  try {
    S.rows = await call('search', U.name, U.pin, S.who, q);
    S.area = {
      sigu: '검색',
      dong: "\"".concat(q, "\""),
      search: true
    };
    S.flt = 'all';
    S.q = '';
    S.shown = 60;
    renderRows();
  } catch (e) {
    toast(e.message || '검색 실패');
    renderAreas();
  }
}

/* ── 동 상세 ── */
async function openArea(i) {
  S.area = S.areas[i];
  S.flt = 'todo';
  S.q = '';
  S.shown = 60;
  S.view = 'rows';
  $('main').innerHTML = '<div class="spin">불러오는 중…</div>';
  window.scrollTo(0, 0);
  try {
    S.rows = await call('dongRows', U.name, U.pin, S.who, S.area.sigu, S.area.dong, S.area.from, S.area.to);
    applyQueue();
    renderRows();
  } catch (e) {
    $('main').innerHTML = "<div class=\"card\">⚠️ ".concat(esc(e.message || e), "</div>");
  }
}
function applyQueue() {
  const q = queue();
  q.forEach(it => {
    const r = S.rows.find(x => x.row === it.row && x.m === it.m);
    if (r) {
      r.st = it.st;
      r.rs = it.rs || '';
    }
  });
}
function groups() {
  const q = S.q.replace(/\s+/g, ''),
    G = [],
    idx = {};
  S.rows.forEach(r => {
    if (S.flt === 'todo' && r.st !== '미착수') return;
    if (S.flt === 'undone' && r.st !== '미완료') return;
    if (S.flt === 'done' && r.st !== '완료') return;
    if (q && (r.jb + r.ra + r.m + r.pn).replace(/\s+/g, '').indexOf(q) < 0) return;
    let g = idx[r.jb];
    if (!g) {
      g = idx[r.jb] = {
        jb: r.jb,
        ra: r.ra,
        rd: r.rd,
        list: []
      };
      G.push(g);
    }
    g.list.push(r);
  });
  return G;
}
let GS = [];
function renderRows() {
  const a = S.area,
    all = S.rows,
    G = groups();
  const n = {
    todo: all.filter(r => r.st === '미착수').length,
    undone: all.filter(r => r.st === '미완료').length,
    done: all.filter(r => r.st === '완료').length
  };

    return "<tr>\n      <td>".concat(esc(x.name), "</td>\n      <td>").concat(fmt(x.recv), "</td>\n      <td>").concat(fmt(x.dispatched), "</td>\n      <td style=\"font-weight:800;color:").concat(x.remain < 100 ? 'var(--red)' : 'var(--done)', "\">").concat(fmt(x.remain), "</td>\n      <td style=\"min-width:60px\"><div class=\"stock-bar\"><div class=\"fill\" style=\"background:").concat(fc, ";width:").concat(p, "%\"></div></div></td>\n    </tr>");
  }).join('');
  $('main').innerHTML = "\n  <div class=\"card\">\n    <h2>자재 현황</h2>\n    <div class=\"matl-kpi\">\n      <div class=\"mk\" style=\"background:#e0f2fe;color:#0369a1\">\n        <div class=\"mv\">".concat(matlStock.length, "</div><div class=\"ml\">자재 종류</div>\n      </div>\n      <div class=\"mk\" style=\"background:var(--done-bg);color:var(--done-fg)\">\n        <div class=\"mv\">").concat(fmt(dispTotal), "</div><div class=\"ml\">총 분출</div>\n      </div>\n      <div class=\"mk\" style=\"background:var(--undone-bg);color:var(--undone-fg)\">\n        <div class=\"mv\">").concat(fmt(total), "</div><div class=\"ml\">총 잔량</div>\n      </div>\n    </div>\n    <div style=\"overflow-x:auto\">\n      <table>\n        <thead><tr><th>자재명</th><th>수령</th><th>분출</th><th>잔량</th><th>현황</th></tr></thead>\n        <tbody>").concat(stockRows, "</tbody>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h2>자재 분출 등록</h2>\n    <div class=\"form-group\">\n      <label>자재 선택</label>\n      <select id=\"dispId\">").concat(matlStock.map(x => "<option value=\"".concat(esc(x.id), "\">").concat(esc(x.name), " (잔량: ").concat(fmt(x.remain), ")</option>")).join(''), "</select>\n    </div>\n    <div class=\"form-group\">\n      <label>수량</label>\n      <input id=\"dispQty\" type=\"number\" min=\"1\" placeholder=\"수량 입력\">\n    </div>\n    <div class=\"form-group\">\n      <label>비고 (선택)</label>\n      <input id=\"dispNote\" type=\"text\" placeholder=\"메모\">\n    </div>\n    <button class=\"btn-primary\" onclick=\"submitDispatch()\">📤 분출 등록</button>\n  </div>");
}
async function submitDispatch() {
  const id = $('dispId').value,
    qty = parseInt($('dispQty').value),
    note = $('dispNote').value;
  if (!id || !qty || qty <= 0) {
    toast('자재와 수량을 입력하세요');
    return;
  }
  const item = matlStock.find(x => x.id === id);
  if (item && qty > item.remain) {
    toast('잔량 부족: ' + item.remain + ' EA');
    return;
  }
  try {
    const res = await call('addMatlDispatch', id, qty, U.name, U.office, note);
    if (res.ok) {
      toast('분출 등록 완료 (' + qty + ' EA)');
      matlStock = null;
      loadMatl();
    } else toast('오류: ' + (res.error || '실패'));
  } catch (err) {
    toast('오류: ' + err.message);
  }
}</script>
</body>
</html>
