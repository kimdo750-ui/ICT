<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12303a">
<title>공정사진 — 현장 촬영 (클라우드)</title>
<style>
  :root{
    --bg:#0e2830;--panel:#12303a;--panel-2:#17414d;--ink:#f2f7f6;--ink-dim:#9db4b8;
    --line:#22525f;--safety:#ff7a29;--before:#3aa0ff;--during:#ffc24b;--after:#35d07f;--danger:#ff4d4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:2px solid var(--line);padding:12px 14px 10px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .dot{width:11px;height:11px;border-radius:2px;background:var(--safety);box-shadow:0 0 0 3px rgba(255,122,41,.2);}
  .brand h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:800;}
  .brand .tag{margin-left:auto;font-size:11px;color:var(--ink-dim);border:1px solid var(--line);padding:3px 7px;border-radius:20px;}
  .cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:5px;vertical-align:middle;}
  .cloud-dot.on{background:var(--after);}
  .site-row,.work-row{margin-top:8px;display:flex;gap:8px;align-items:center;}
  .site-row label,.work-row label{font-size:12px;color:var(--ink-dim);white-space:nowrap;width:34px;}
  .site-row input,.work-row input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:15px;padding:9px 11px;border-radius:9px;font-weight:600;}
  .site-row input::placeholder,.work-row input::placeholder{color:#5f7c82;}
  main{padding:16px 14px 130px;}
  .stage-label{font-size:12px;color:var(--ink-dim);margin:2px 2px 9px;text-transform:uppercase;letter-spacing:1.5px;}
  .stages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:18px;}
  .stage{position:relative;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 6px 12px;text-align:center;transition:.12s;cursor:pointer;}
  .stage .n{font-size:11px;color:var(--ink-dim);font-weight:700;}
  .stage .t{font-size:16px;font-weight:800;margin-top:3px;}
  .stage .c{display:block;width:26px;height:5px;border-radius:3px;margin:8px auto 0;opacity:.5;}
  .stage[data-s="before"] .c{background:var(--before);}
  .stage[data-s="during"] .c{background:var(--during);}
  .stage[data-s="after"] .c{background:var(--after);}
  .stage.active{transform:translateY(-1px);}
  .stage.active[data-s="before"]{border-color:var(--before);box-shadow:0 0 0 3px rgba(58,160,255,.16);}
  .stage.active[data-s="during"]{border-color:var(--during);box-shadow:0 0 0 3px rgba(255,194,75,.16);}
  .stage.active[data-s="after"]{border-color:var(--after);box-shadow:0 0 0 3px rgba(53,208,127,.16);}
  .stage.active .c{opacity:1;height:6px;}
  .shoot{width:100%;border:none;border-radius:18px;padding:22px;font-size:21px;font-weight:900;letter-spacing:.5px;color:#06222b;background:var(--safety);display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 8px 0 #c85a17;transition:.08s;cursor:pointer;}
  .shoot:active{transform:translateY(5px);box-shadow:0 3px 0 #c85a17;}
  .shoot svg{width:28px;height:28px;}
  .hidden-input{display:none;}
  .hint{text-align:center;font-size:12px;color:var(--ink-dim);margin:12px 4px 0;line-height:1.5;}
  .counts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:22px 0 8px;}
  .cnt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;}
  .cnt .num{font-size:26px;font-weight:900;line-height:1;}
  .cnt .lb{font-size:11px;color:var(--ink-dim);margin-top:5px;}
  .cnt[data-s="before"] .num{color:var(--before);}
  .cnt[data-s="during"] .num{color:var(--during);}
  .cnt[data-s="after"] .num{color:var(--after);}
  .gallery-head{display:flex;align-items:center;margin:20px 2px 10px;}
  .gallery-head h2{font-size:14px;margin:0;font-weight:800;letter-spacing:.5px;}
  .gallery-head .total{margin-left:auto;font-size:12px;color:var(--ink-dim);}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
  .cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .cell .badge{position:absolute;top:5px;left:5px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#06222b;}
  .cell .badge.before{background:var(--before);}
  .cell .badge.during{background:var(--during);}
  .cell .badge.after{background:var(--after);}
  .cell .up{position:absolute;bottom:4px;right:4px;font-size:13px;}
  .cell .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;border-radius:6px;background:rgba(6,34,43,.75);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .empty{text-align:center;color:var(--ink-dim);font-size:13px;padding:40px 10px;border:1px dashed var(--line);border-radius:12px;line-height:1.6;}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;}
  .btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
  .btn.up{background:var(--after);color:#06222b;}
  .btn.up:disabled{opacity:.4;}
  .btn.export{background:var(--panel-2);color:var(--ink);flex:0 0 auto;padding:14px 16px;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#06222b;color:var(--ink);border:1px solid var(--line);padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* 설정 시트 */
  .settings{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;}
  .settings summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-dim);}
  .settings input{width:100%;margin-top:9px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:13px;padding:9px;border-radius:8px;}
  .settings p{font-size:11px;color:var(--ink-dim);margin:8px 0 0;line-height:1.5;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>공정사진</h1>
    <span class="tag"><span class="cloud-dot" id="cloudDot"></span>클라우드</span>
  </div>
  <div class="site-row"><label>현장</label><input id="siteName" placeholder="예) OO빌딩 신축 통신공사" autocomplete="off"></div>
  <div class="work-row"><label>공종</label><input id="workName" placeholder="예) 국선단자함 설치 / 관로 포설" autocomplete="off"></div>
</header>

<main>
  <details class="settings" id="settings">
    <summary>⚙ 구글시트 연결 설정</summary>
    <input id="apiUrl" placeholder="Apps Script 웹앱 URL 붙여넣기" autocomplete="off">
    <p>구글시트 → 확장프로그램 → Apps Script에 백엔드 코드를 넣고 배포하면 나오는 URL을 여기에 붙여넣으세요. 한 번 넣으면 이 기기에 저장됩니다.</p>
  </details>

  <div class="stage-label">▸ 지금 찍는 단계를 고르세요</div>
  <div class="stages" id="stages">
    <div class="stage active" data-s="before"><div class="n">STEP 1</div><div class="t">작업 전</div><span class="c"></span></div>
    <div class="stage" data-s="during"><div class="n">STEP 2</div><div class="t">작업 중</div><span class="c"></span></div>
    <div class="stage" data-s="after"><div class="n">STEP 3</div><div class="t">작업 후</div><span class="c"></span></div>
  </div>

  <button class="shoot" id="shootBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span id="shootLabel">작업 전 촬영</span>
  </button>
  <input type="file" id="camInput" class="hidden-input" accept="image/*" multiple>
  <p class="hint">찍으면 자동 압축되어 목록에 담깁니다. <b>업로드</b>를 누르면 구글시트로 한 번에 전송됩니다.<br>신호 약한 맨홀·지하에서는 일단 찍어두고 신호 잡히면 업로드하세요.</p>

  <div class="counts">
    <div class="cnt" data-s="before"><div class="num" id="cBefore">0</div><div class="lb">작업 전</div></div>
    <div class="cnt" data-s="during"><div class="num" id="cDuring">0</div><div class="lb">작업 중</div></div>
    <div class="cnt" data-s="after"><div class="num" id="cAfter">0</div><div class="lb">작업 후</div></div>
  </div>

  <div class="gallery-head"><h2>촬영 목록</h2><span class="total" id="totalLabel">0장</span></div>
  <div id="gallery"></div>
</main>

<div class="bottombar">
  <button class="btn up" id="uploadBtn" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span id="uploadLabel">구글시트 업로드</span>
  </button>
  <button class="btn export" id="exportBtn" title="사진대지 미리보기">대지</button>
</div>

<div class="toast" id="toast"></div>

<script>
const STAGE_KR={before:'작업 전',during:'작업 중',after:'작업 후'};
const STAGE_ORDER={before:0,during:1,after:2};
const MAX_W=1280, JPEG_Q=0.72;   // 리사이즈 기준: 가로 1280px, 품질 72%
let currentStage='before', photos=[], seq=0, gps='';
const $=id=>document.getElementById(id);

/* API URL 저장/복원 (이 기기에만) */
try{ const saved=localStorage.getItem('photoApiUrl'); if(saved){$('apiUrl').value=saved;} }catch(e){}
$('apiUrl').addEventListener('change',()=>{
  const v=$('apiUrl').value.trim();
  try{ localStorage.setItem('photoApiUrl',v); }catch(e){}
  $('cloudDot').classList.toggle('on', v.length>0);
  toast(v?'구글시트 연결됨':'URL 지웠어요');
});
if($('apiUrl').value.trim()) $('cloudDot').classList.add('on');

/* GPS 한 번 확보 (선택) */
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    p=>{ gps=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6); },
    ()=>{ gps=''; }, {enableHighAccuracy:true,timeout:8000}
  );
}

/* 단계 선택 */
$('stages').addEventListener('click',e=>{
  const s=e.target.closest('.stage'); if(!s)return;
  currentStage=s.dataset.s;
  document.querySelectorAll('.stage').forEach(x=>x.classList.toggle('active',x===s));
  $('shootLabel').textContent=STAGE_KR[currentStage]+' 촬영';
});

$('shootBtn').addEventListener('click',()=>$('camInput').click());

/* 촬영 → 리사이즈 → 목록 */
$('camInput').addEventListener('change',async e=>{
  const files=[...e.target.files]; if(!files.length)return;
  const site=$('siteName').value.trim()||'(현장명 미입력)';
  const work=$('workName').value.trim();
  const stageAtShot=currentStage;
  for(const file of files){
    const dataUrl=await resizeImage(file);
    photos.push({
      id:++seq, stage:stageAtShot, dataUrl,
      time:formatTime(new Date(file.lastModified||Date.now())),
      site, work:work||'(공종 미입력)', gps, uploaded:false
    });
    render();
  }
  $('camInput').value='';
  toast(`${STAGE_KR[stageAtShot]} ${files.length}장 추가 (압축됨)`);
});

/* 이미지 리사이즈 — 용량 확 줄여서 업로드 빠르게 */
function resizeImage(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>MAX_W){ h=Math.round(h*MAX_W/w); w=MAX_W; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',JPEG_Q));
    };
    img.onerror=()=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file); };
    const r=new FileReader(); r.onload=ev=>img.src=ev.target.result; r.readAsDataURL(file);
  });
}

function formatTime(d){return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function p(n){return String(n).padStart(2,'0');}

function render(){
  const c={before:0,during:0,after:0};
  photos.forEach(x=>c[x.stage]++);
  $('cBefore').textContent=c.before; $('cDuring').textContent=c.during; $('cAfter').textContent=c.after;
  const pending=photos.filter(x=>!x.uploaded).length;
  $('totalLabel').textContent=photos.length+'장'+(pending?` (미전송 ${pending})`:'');
  $('uploadBtn').disabled=pending===0;
  $('uploadLabel').textContent=pending?`구글시트 업로드 (${pending})`:'전송 완료';

  const g=$('gallery');
  if(!photos.length){ g.innerHTML=`<div class="empty">아직 찍은 사진이 없습니다.<br>단계를 고르고 <b>촬영</b> 버튼을 누르세요.</div>`; return; }
  const sorted=[...photos].reverse();
  g.className='grid';
  g.innerHTML=sorted.map(x=>`
    <div class="cell">
      <img src="${x.dataUrl}" alt="">
      <span class="badge ${x.stage}">${STAGE_KR[x.stage]}</span>
      <button class="del" data-id="${x.id}">×</button>
      <span class="up">${x.uploaded?'✅':''}</span>
    </div>`).join('');
  g.querySelectorAll('.del').forEach(b=>b.onclick=()=>{photos=photos.filter(x=>x.id!=b.dataset.id);render();toast('삭제됨');});
}

/* 구글시트 업로드 */
$('uploadBtn').addEventListener('click',async()=>{
  const url=$('apiUrl').value.trim();
  if(!url){ toast('먼저 ⚙ 설정에서 구글시트 URL을 넣어주세요'); $('settings').open=true; return; }
  const site=$('siteName').value.trim()||'(현장명 미입력)';
  const pending=photos.filter(x=>!x.uploaded);
  if(!pending.length){ toast('업로드할 사진이 없어요'); return; }

  $('uploadBtn').disabled=true; $('uploadLabel').textContent='전송 중…';
  let ok=0, fail=0;
  // 한 장씩 전송 (실패해도 나머지 계속)
  for(const ph of pending){
    try{
      const payload={ site:ph.site, work:ph.work, stage:STAGE_KR[ph.stage], time:ph.time, gps:ph.gps, image:ph.dataUrl };
      const r=await fetch(url,{ method:'POST', body:JSON.stringify(payload) });
      const j=await r.json();
      if(j.status==='success'){ ph.uploaded=true; ok++; } else { fail++; }
    }catch(err){ fail++; }
    render();
  }
  toast(`전송 완료 · 성공 ${ok}${fail?` / 실패 ${fail}`:''}`);
});

/* 사진대지 미리보기 (로컬) */
$('exportBtn').addEventListener('click',()=>{
  if(!photos.length){ toast('사진이 없어요'); return; }
  const site=$('siteName').value.trim()||'(현장명 미입력)';
  const ordered=[...photos].sort((a,b)=>a.work!==b.work?(a.work<b.work?-1:1):(a.stage!==b.stage?STAGE_ORDER[a.stage]-STAGE_ORDER[b.stage]:a.time<b.time?-1:1));
  const byWork={}; ordered.forEach(x=>(byWork[x.work]||=[]).push(x));
  let rows='';
  Object.keys(byWork).forEach(work=>{
    const g={before:[],during:[],after:[]}; byWork[work].forEach(x=>g[x.stage].push(x));
    const maxN=Math.max(g.before.length,g.during.length,g.after.length,1);
    for(let i=0;i<maxN;i++){
      const cell=(arr,lb)=>{const x=arr[i];return x?`<td class="ph"><div class="lab">${lb}</div><img src="${x.dataUrl}"><div class="meta">${x.time}</div></td>`:`<td class="ph"><div class="lab">${lb}</div><div class="none">—</div></td>`;};
      rows+=`<tr>${i===0?`<td class="work" rowspan="${maxN}">${esc(work)}</td>`:''}${cell(g.before,'작업 전')}${cell(g.during,'작업 중')}${cell(g.after,'작업 후')}</tr>`;
    }
  });
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>사진대지 - ${esc(site)}</title>
<style>@page{size:A4;margin:12mm;}*{box-sizing:border-box;}body{font-family:"Malgun Gothic",sans-serif;color:#111;margin:0;padding:16px;}
.doc-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:4px;border:2px solid #111;padding:10px;margin-bottom:14px;}
.info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;}table{width:100%;border-collapse:collapse;table-layout:fixed;}
td{border:1px solid #333;vertical-align:top;padding:6px;}td.work{width:80px;text-align:center;font-weight:800;font-size:13px;background:#f2f2f2;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:2px;}
td.ph{width:calc((100% - 80px)/3);height:170px;text-align:center;}td.ph .lab{font-size:11px;font-weight:800;color:#fff;background:#333;display:inline-block;padding:2px 10px;border-radius:3px;margin-bottom:5px;}
td.ph img{max-width:100%;max-height:120px;object-fit:contain;display:block;margin:0 auto;}td.ph .meta{font-size:10px;color:#666;margin-top:4px;}td.ph .none{color:#bbb;font-size:20px;padding:40px 0;}
.noprint{position:fixed;top:10px;right:10px;background:#ff7a29;color:#06222b;border:none;padding:12px 20px;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;}@media print{.noprint{display:none;}body{padding:0;}}</style></head><body>
<button class="noprint" onclick="window.print()">🖨 인쇄 / PDF</button><div class="doc-title">사 진 대 지</div>
<div class="info"><div>현장명 : <b>${esc(site)}</b></div><div>작성일 : ${formatTime(new Date())}</div></div>
<table><colgroup><col style="width:80px"><col><col><col></colgroup>${rows}</table></body></html>`;
  const w=window.open('','_blank'); if(w){w.document.write(html);w.document.close();}else{toast('팝업 허용 후 다시 시도');}
});

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}
render();
</script>
</body>
</html>
