<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자재 인수인계</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--line:#e4e6eb;--ink:#1a1b1e;--ink2:#6b7280;--mute:#9ca3af;
  --navy:#1d4ed8;--red:#dc2626;--done:#16a34a;--done-bg:#dcfce7;
  --radius:14px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}

header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;font-weight:900;color:var(--navy)}
header .sub{font-size:12px;color:var(--mute);margin-top:2px}

main{padding:14px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
h2{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}

.worker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.worker-btn{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700;text-align:center}
.worker-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* 사진 촬영 버튼 */
.btn-photo{width:100%;border:0;background:var(--navy);color:#fff;font-size:17px;font-weight:800;padding:16px;border-radius:13px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-photo:active{opacity:.85}

/* 미리보기 */
#previewWrap{display:none;margin-bottom:10px;position:relative}
#previewImg{width:100%;border-radius:10px;display:block}
#ocrOverlay{position:absolute;inset:0;background:rgba(0,0,0,.45);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;gap:8px}
#ocrSpinner{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* OCR 원본 결과 */
#ocrRaw{font-size:11px;color:var(--mute);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;word-break:break-all;display:none;max-height:80px;overflow-y:auto}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input{width:100%;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit}
.field input:focus{outline:none;border-color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn-add-item{width:100%;border:0;background:var(--done);color:#fff;font-size:15px;font-weight:800;padding:13px;border-radius:11px;margin-top:4px}

.item-list{margin-bottom:8px}
.item-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.item-row .info{flex:1}
.item-row .name{font-size:14px;font-weight:800}
.item-row .detail{font-size:12px;color:var(--ink2);margin-top:2px}
.item-row .del{border:0;background:none;color:var(--mute);font-size:18px;padding:0 4px}

.sub-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sub-row input{flex:1;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-family:inherit}
.sub-row input:focus{outline:none;border-color:var(--navy)}
.sub-row input.qty{width:80px;flex:none}
.btn-add-sub{border:1.5px dashed var(--line);background:none;color:var(--navy);font-size:13px;font-weight:700;padding:10px;border-radius:9px;width:100%}

.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.btn-reset{flex:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink2);font-size:14px;font-weight:700;padding:13px 16px;border-radius:12px}
.btn-pdf{flex:1;border:0;background:var(--done);color:#fff;font-size:15px;font-weight:800;padding:14px;border-radius:12px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:24px;opacity:0;transition:.2s;pointer-events:none;z-index:80;white-space:nowrap}
#toast.on{opacity:1}


/* MAC 리스트 패널 */
#macPanel{display:none;margin-top:10px;background:var(--bg);border:1.5px solid var(--navy);border-radius:11px;overflow:hidden}
#macPanel .mac-header{background:var(--navy);color:#fff;padding:10px 12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
#macPanel .mac-body{max-height:220px;overflow-y:auto;padding:8px}
.mac-row{font-family:'Courier New',Consolas,monospace;font-size:12px;padding:5px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.mac-row:last-child{border-bottom:0}
.mac-row .seq{color:var(--mute);min-width:24px;text-align:right}
.mac-row .mac{flex:1;font-weight:700;letter-spacing:.5px;color:var(--ink)}
.mac-row .model{font-size:11px;color:var(--ink2)}
.mac-empty{padding:12px;text-align:center;color:var(--mute);font-size:13px}
.mac-export-btn{width:100%;border:0;background:var(--done);color:#fff;font-size:13px;font-weight:800;padding:10px;border-top:1px solid rgba(0,0,0,.1)}

@media print{
  header,.btn-photo,.btn-add-sub,.bottom,#toast,.del,#previewWrap,#ocrRaw{display:none!important}
  main{padding:0}
  .card{border:1px solid #ccc;page-break-inside:avoid}
  body{background:#fff}
  .worker-grid{display:flex;flex-wrap:wrap;gap:6px}
  .worker-btn{display:none}
  .worker-btn.on{display:block;border:1px solid #333;background:#fff;color:#000;font-size:13px;padding:4px 10px}
}
</style>
</head>
<body>

<header>
  <h1>&#9889; AMI 자재 인수인계</h1>
  <div class="sub" id="hDate"></div>
</header>

<main>
  <div class="card">
    <h2>&#128119; 작업자 선택</h2>
    <div class="worker-grid" id="workerGrid"></div>
  </div>

  <div class="card">
    <h2>&#128230; 박스 등록</h2>

    <!-- 카메라 input (사진 촬영) -->
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this)">
    <button class="btn-photo" onclick="document.getElementById('photoInput').click()">
      <span style="font-size:22px">&#128247;</span> 박스 사진 찍기
    </button>

    <!-- 사진 미리보기 + OCR 진행 -->
    <div id="previewWrap">
      <img id="previewImg" src="" alt="박스사진">
      <div id="ocrOverlay">
        <div id="ocrSpinner"></div>
        <div id="ocrMsg">인식 중...</div>
      </div>
    </div>

    <!-- OCR 원본 (접힘) -->
    <div id="ocrRaw"></div>

    <!-- 필드 -->
    <div class="field"><label>품명</label><input id="manName" placeholder="예: SMGW-C (LTE)"></div>
    <div class="row2">
      <div class="field"><label>박스번호</label><input id="manBox" placeholder="예: 004868" onblur="if(this.value)lookupMac(this.value)" onkeydown="if(event.key==='Enter'&&this.value)lookupMac(this.value)"></div>
      <div class="field"><label>수량 (EA)</label><input id="manQty" type="number" placeholder="40"></div>
    </div>
    <!-- MAC 자동 조회 결과 패널 -->
    <div id="macPanel">
      <div class="mac-header">
        <span>📋</span>
        <span id="macPanelTitle">박스 MAC 목록</span>
      </div>
      <div class="mac-body" id="macBody"></div>
      <button class="mac-export-btn" onclick="copyMacList()">📋 MAC 목록 복사</button>
    </div>
    <button class="btn-add-item" onclick="addItem()">&#10133; 박스 추가</button>
  </div>

  <div class="card" id="modemCard" style="display:none">
    <h2>&#9989; 등록된 박스 <span id="modemCount" style="color:var(--navy)"></span></h2>
    <div class="item-list" id="modemList"></div>
    <div style="font-size:13px;font-weight:700;color:var(--done);background:var(--done-bg);border-radius:9px;padding:9px 12px" id="modemTotal"></div>
  </div>

  <!-- E타입 MAC 스캔 링크 -->
  <div class="card" style="background:#fef3c7;border-color:#d97706">
    <h2 style="color:#b45309">&#128241; LTE E타입 MAC 스캔</h2>
    <div style="font-size:13px;color:#78350f;margin-bottom:10px">E타입은 박스 개봉 후 모뎀 하나씩 스캔 → 엑셀로 저장하세요</div>
    <a href="mac-scan.html" style="display:block;background:#d97706;color:#fff;text-align:center;font-size:15px;font-weight:800;padding:13px;border-radius:11px;text-decoration:none">&#128247; E타입 MAC 스캔 열기</a>
  </div>

  <div class="card">
    <h2>&#128295; 부자재 (수동입력)</h2>
    <div id="subList"></div>
    <button class="btn-add-sub" onclick="addSubRow()">&#65291; 부자재 추가</button>
  </div>

  <div class="card">
    <h2>&#128221; 특이사항</h2>
    <textarea id="memo" style="width:100%;font-size:14px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;resize:none;min-height:72px" placeholder="특이사항 입력 (선택)"></textarea>
  </div>
</main>

<div class="bottom">
  <button class="btn-reset" onclick="resetAll()">&#128465;&#65039; 초기화</button>
  <button class="btn-pdf" onclick="savePDF()">&#128247; 이미지 저장</button>
</div>
<div id="toast"></div>
<canvas id="qcvs" style="display:none"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var WORKERS=[
  {name:'김동일',role:'현장대리인'},
  {name:'이영건',role:'작업원'},
  {name:'김상식',role:'작업원'},
  {name:'김현수',role:'작업원'},
  {name:'김형기',role:'작업원'},
  {name:'김성철',role:'작업원'},
  {name:'심문희',role:'작업원'},
  {name:'김민준',role:'작업원'},
  {name:'진언경',role:'작업원'},
  {name:'조성용',role:'작업원'},
  {name:'권혁태',role:'작업원'},
  {name:'정성현',role:'작업원'},
  {name:'유병옥',role:'작업원'},
  {name:'오진규',role:'작업원'},
  {name:'김동숙',role:'작업원'}
];

var selectedWorker=null;
var modemItems=[];

// 날짜
var now=new Date();
var pad=function(n){return String(n).padStart(2,'0');};
document.getElementById('hDate').textContent=
  now.getFullYear()+'.'+pad(now.getMonth()+1)+'.'+pad(now.getDate())+
  ' '+pad(now.getHours())+':'+pad(now.getMinutes())+' 작성';

function renderWorkers(){
  var g=document.getElementById('workerGrid');
  g.innerHTML=WORKERS.map(function(w){
    return '<button class="worker-btn'+(selectedWorker===w.name?' on':'')+
      '" onclick="selectWorker(\''+w.name+'\')">'+w.name+'</button>';
  }).join('');
}
renderWorkers();

function selectWorker(name){
  selectedWorker=name;
  renderWorkers();
  toast('&#128119; '+name+' 선택됨');
}

// ── 사진 촬영 후 처리 ──
function onPhoto(input){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var url=URL.createObjectURL(file);

  // 미리보기
  var pw=document.getElementById('previewWrap');
  var pi=document.getElementById('previewImg');
  pi.src=url;
  pw.style.display='block';
  document.getElementById('ocrOverlay').style.display='flex';
  document.getElementById('ocrMsg').textContent='QR 인식 중...';

  var img=new Image();
  img.onload=function(){
    // 1단계: jsQR로 QR 시도
    var c=document.getElementById('qcvs');
    c.width=img.naturalWidth;c.height=img.naturalHeight;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0);
    var idata=ctx.getImageData(0,0,c.width,c.height);
    var qr=jsQR(idata.data,idata.width,idata.height,{inversionAttempts:'attemptBoth'});
    if(qr&&qr.data){
      hideOverlay();
      toast('&#9989; QR 인식 성공!');
      parseAndFill(qr.data,'QR');
    } else {
      // 2단계: Tesseract OCR
      document.getElementById('ocrMsg').textContent='텍스트 인식 중...';
      runOCR(url);
    }
  };
  img.src=url;
  input.value=''; // 같은 파일 재선택 허용
}

function runOCR(url){
  var done=false;

  // 30초 타임아웃
  var timer=setTimeout(function(){
    if(done)return;
    done=true;
    failOverlay('⏱ 시간 초과');
    toast('⏱ 인식 시간 초과 — 직접 입력해주세요');
  },30000);

  Tesseract.recognize(url,['kor','eng'],{
    logger:function(m){
      if(done)return;
      if(m.status==='recognizing text'){
        document.getElementById('ocrMsg').textContent='인식 중... '+Math.round((m.progress||0)*100)+'%';
      }
    }
  }).then(function(result){
    if(done)return;
    done=true;
    clearTimeout(timer);
    hideOverlay();
    var text=(result.data&&result.data.text)||'';
    if(!text.trim()){
      failOverlay('❌ 읽기 실패');
      toast('❌ 텍스트를 읽지 못했어요 — 직접 입력해주세요');
      return;
    }
    showOcrRaw(text);
    parseAndFill(text,'OCR');
  }).catch(function(e){
    if(done)return;
    done=true;
    clearTimeout(timer);
    failOverlay('❌ 인식 실패');
    toast('❌ 인식 실패 — 직접 입력해주세요');
    console.error(e);
  });
}

function hideOverlay(){
  document.getElementById('ocrOverlay').style.display='none';
  document.getElementById('ocrOverlay').style.background='rgba(0,0,0,.45)'; // 원복
}
function failOverlay(msg){
  var ov=document.getElementById('ocrOverlay');
  ov.style.background='rgba(180,30,30,.75)';
  document.getElementById('ocrSpinner').style.display='none';
  document.getElementById('ocrMsg').textContent=msg||'인식 실패';
  // 2초 후 자동으로 오버레이 닫기
  setTimeout(function(){
    hideOverlay();
    document.getElementById('ocrSpinner').style.display='';
  },2000);
}
function showOcrRaw(text){
  var el=document.getElementById('ocrRaw');
  el.style.display='block';
  el.textContent='원본: '+text.replace(/\n/g,' | ').slice(0,200);
}

// ── 파싱: QR 텍스트 또는 OCR 텍스트 → 필드 채우기 ──
function parseAndFill(raw, src){
  var name='', boxno='', qty=0;
  var lines=raw.split(/[\n\r]+/).map(function(s){return s.trim();}).filter(Boolean);

  lines.forEach(function(l){
    // 콜론 기준 key:value 파싱
    var m=l.match(/^([^:：]+)[：:]\s*(.+)$/);
    if(m){
      var k=m[1].replace(/\s/g,'');
      var v=m[2].trim();
      if(/품명|품목|명칭/.test(k)) name=v;
      else if(/수량|QTY/.test(k)){var n=parseInt(v);if(n>0)qty=n;}
      else if(/BOXNo|박스번호|BOX/.test(k)) boxno=v.replace(/[^A-Za-z0-9가-힣]/g,'');
      else if(/공고번호/.test(k)) {if(!boxno) boxno=v;}
    }
    // # BOX No:004868 형식
    var bm=l.match(/#\s*BOX\s*No[:\s]*([A-Za-z0-9]+)/i);
    if(bm) boxno=bm[1];
    // 수량 단독: "40 EA" or "40EA"
    var qm=l.match(/^(\d+)\s*EA$/i);
    if(qm&&!qty) qty=parseInt(qm[1]);
  });

  // 기본값
  if(!name) name='AE-Type 외장형 모뎀(E-Type)';
  if(!qty) qty=40;

  document.getElementById('manName').value=name;
  document.getElementById('manBox').value=boxno;
  document.getElementById('manQty').value=qty;
  toast('&#9989; '+src+' 인식 완료 — 확인 후 추가 버튼!');
  // 박스번호가 인식되면 자동으로 MAC 조회
  if(boxno) lookupMac(boxno);
}

function addItem(){
  var name=document.getElementById('manName').value.trim();
  var boxno=document.getElementById('manBox').value.trim();
  var qty=parseInt(document.getElementById('manQty').value)||0;
  if(!name){toast('품명을 입력하세요');return;}
  modemItems.push({name:name,boxno:boxno,qty:qty});
  document.getElementById('manName').value='';
  document.getElementById('manBox').value='';
  document.getElementById('manQty').value='';
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('ocrRaw').style.display='none';
  document.getElementById('macPanel').style.display='none';
  renderModem();
  toast('&#128230; 박스 추가됨 ('+qty+'EA)');
}

function renderModem(){
  var list=document.getElementById('modemList');
  var card=document.getElementById('modemCard');
  if(!modemItems.length){card.style.display='none';return;}
  card.style.display='';
  var total=modemItems.reduce(function(s,x){return s+x.qty;},0);
  document.getElementById('modemCount').textContent=modemItems.length+'박스';
  document.getElementById('modemTotal').textContent='총 '+modemItems.length+'박스 · '+total+'EA';
  list.innerHTML=modemItems.map(function(it,i){
    return '<div class="item-row">'+
      '<div class="info">'+
        '<div class="name">'+esc(it.name)+'</div>'+
        '<div class="detail">'+(it.boxno?'박스번호: '+esc(it.boxno)+' · ':'')+it.qty+'EA</div>'+
      '</div>'+
      '<button class="del" onclick="delModem('+i+')">&#10005;</button>'+
    '</div>';
  }).join('');
}
function delModem(i){modemItems.splice(i,1);renderModem();}

function addSubRow(){
  var d=document.getElementById('subList');
  var row=document.createElement('div');
  row.className='sub-row';
  row.innerHTML='<input placeholder="부자재명 (예: 방수캡)"><input class="qty" type="number" placeholder="수량" min="1"><button style="border:0;background:none;color:var(--mute);font-size:18px" onclick="this.parentNode.remove()">&#10005;</button>';
  d.appendChild(row);
}

function savePDF(){
  if(!selectedWorker){toast('작업자를 먼저 선택해주세요');return;}
  if(!modemItems.length){toast('박스를 하나 이상 추가해주세요');return;}

  // 인쇄용 HTML 생성
  var w=selectedWorker;
  var now=new Date();
  var ds=now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+
         String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var total=modemItems.reduce(function(s,x){return s+x.qty;},0);

  // 부자재 수집
  var subRows=Array.from(document.querySelectorAll('#subList .sub-row'));
  var subHTML='';
  subRows.forEach(function(r){
    var inputs=r.querySelectorAll('input');
    var sn=(inputs[0]&&inputs[0].value.trim())||'';
    var sq=parseInt((inputs[1]&&inputs[1].value)||0)||0;
    if(sn) subHTML+='<tr><td>'+esc(sn)+'</td><td>'+sq+'EA</td></tr>';
  });

  var memo=document.getElementById('memo').value.trim();

  var html='<div id="printBox" style="font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;font-size:13px;color:#111;background:#fff;padding:20px;width:360px">'+
    '<div style="text-align:center;font-size:17px;font-weight:900;border-bottom:2px solid #1d4ed8;padding-bottom:8px;margin-bottom:12px;color:#1d4ed8">⚡ AMI 자재 인수인계서</div>'+
    '<table style="width:100%;border-collapse:collapse;margin-bottom:10px">'+
      '<tr><td style="padding:4px 6px;font-weight:700;width:70px">일시</td><td style="padding:4px 6px">'+ds+'</td></tr>'+
      '<tr style="background:#f0f4ff"><td style="padding:4px 6px;font-weight:700">수령자</td><td style="padding:4px 6px;font-weight:900;font-size:15px">'+esc(w.name)+'</td></tr>'+
      '<tr><td style="padding:4px 6px;font-weight:700">직책</td><td style="padding:4px 6px">'+esc(w.role)+'</td></tr>'+
    '</table>'+

    '<div style="font-weight:800;margin:10px 0 6px;font-size:13px;color:#444">■ 모뎀 박스</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px">'+
      '<thead><tr style="background:#1d4ed8;color:#fff">'+
        '<th style="padding:5px;text-align:left">품명</th>'+
        '<th style="padding:5px;width:70px">박스번호</th>'+
        '<th style="padding:5px;width:40px">수량</th>'+
      '</tr></thead><tbody>'+
      modemItems.map(function(it){
        // MAC 데이터가 있으면 MAC 수 표시
        var macCount='';
        if(MAC_DATA&&it.boxno){
          var mk=MAC_DATA[String(it.boxno).trim()]||MAC_DATA[String(parseInt(it.boxno,10))];
          if(mk) macCount=' <span style="color:#16a34a;font-size:10px">[MAC '+mk.length+'개]</span>';
        }
        return '<tr style="border-bottom:1px solid #e4e6eb">'+
          '<td style="padding:5px">'+esc(it.name)+macCount+'</td>'+
          '<td style="padding:5px;text-align:center">'+esc(it.boxno||'-')+'</td>'+
          '<td style="padding:5px;text-align:center">'+it.qty+'</td>'+
        '</tr>';
      }).join('')+
      '<tr style="background:#f0f4ff;font-weight:900">'+
        '<td style="padding:5px" colspan="2">합계</td>'+
        '<td style="padding:5px;text-align:center">'+total+'EA</td>'+
      '</tr>'+
    '</tbody></table>'+

    (subHTML?'<div style="font-weight:800;margin:10px 0 6px;font-size:13px;color:#444">■ 부자재</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:12px">'+
        '<thead><tr style="background:#374151;color:#fff"><th style="padding:5px;text-align:left">품명</th><th style="padding:5px;width:60px">수량</th></tr></thead>'+
        '<tbody>'+subHTML+'</tbody></table>':'')+

    (memo?'<div style="font-weight:800;margin:10px 0 6px;font-size:13px;color:#444">■ 특이사항</div>'+
      '<div style="border:1px solid #e4e6eb;border-radius:6px;padding:8px;font-size:12px">'+esc(memo)+'</div>':'')+

    '<div style="margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px">'+
      '<div style="text-align:center;border-top:1px solid #333;padding-top:6px">인수자 서명</div>'+
      '<div style="text-align:center;border-top:1px solid #333;padding-top:6px">인도자 서명</div>'+
    '</div>'+
  '</div>';

  // 임시 DOM에 추가 후 캡처
  var tmp=document.createElement('div');
  tmp.style.cssText='position:fixed;left:-9999px;top:0;z-index:-1';
  tmp.innerHTML=html;
  document.body.appendChild(tmp);
  var pb=tmp.querySelector('#printBox');

  toast('📷 이미지 생성 중...');
  html2canvas(pb,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(function(canvas){
    document.body.removeChild(tmp);
    var dataUrl=canvas.toDataURL('image/png');
    var fname='인수인계_'+esc(w.name)+'_'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'.png';

    // Web Share API (모바일 카카오톡 공유 등)
    if(navigator.share&&navigator.canShare){
      canvas.toBlob(function(blob){
        var file=new File([blob],fname,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:'AMI 자재 인수인계'}).catch(function(){});
        } else {
          // 공유 불가시 다운로드
          var a=document.createElement('a');a.href=dataUrl;a.download=fname;a.click();
        }
      });
    } else {
      // PC/구형 브라우저: 다운로드
      var a=document.createElement('a');a.href=dataUrl;a.download=fname;a.click();
    }
    toast('✅ 저장 완료!');
  }).catch(function(e){
    document.body.removeChild(tmp);
    toast('❌ 이미지 생성 실패');
    console.error(e);
  });
}

function resetAll(){
  if(!confirm('모두 초기화할까요?'))return;
  selectedWorker=null;modemItems=[];
  renderWorkers();renderModem();
  document.getElementById('subList').innerHTML='';
  document.getElementById('memo').value='';
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('ocrRaw').style.display='none';
  toast('초기화됨');
}

// ── MAC 데이터 로드 (압축된 base64 → JSON) ──
var MAC_DATA = null;

function loadMacData(cb){
  if(MAC_DATA !== null){cb(); return;}
  try {
    // pako로 gzip 압축 해제
    var b64 = MAC_B64;
    // base64 디코딩
    var binStr = atob(b64);
    var bytes = new Uint8Array(binStr.length);
    for(var i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);
    // pako inflate (gzip)
    var inflated = pako.inflate(bytes, {to:'string'});
    MAC_DATA = JSON.parse(inflated);
    cb();
  } catch(e) {
    console.error('MAC 데이터 로드 실패:', e);
    MAC_DATA = {};
    cb();
  }
}

function lookupMac(boxno){
  if(!boxno) return;
  loadMacData(function(){
    var key = String(boxno).trim();
    // 여러 형식 시도 (공백 제거, 대문자 등)
    var macs = MAC_DATA[key] || MAC_DATA[key.toUpperCase()] || 
               MAC_DATA[parseInt(key, 10)] || null;
    // 숫자형 박스번호로도 시도
    if(!macs && !isNaN(key)) {
      macs = MAC_DATA[String(parseInt(key,10))];
    }
    showMacPanel(boxno, macs);
  });
}

function showMacPanel(boxno, macs){
  var panel = document.getElementById('macPanel');
  var body = document.getElementById('macBody');
  var title = document.getElementById('macPanelTitle');
  
  if(!macs || !macs.length){
    title.textContent = '박스 '+boxno+' — MAC 데이터 없음';
    body.innerHTML = '<div class="mac-empty">⚠️ 제조사 데이터에 없는 박스번호입니다<br><small>직접 수량을 확인해주세요</small></div>';
    panel.style.display = '';
    return;
  }
  
  title.textContent = '박스 '+boxno+' · '+macs.length+'개 모뎀';
  
  // 수량 자동 입력
  document.getElementById('manQty').value = macs.length;
  // 품명 자동 입력 (모델명 기반)
  if(macs[0] && macs[0].model && !document.getElementById('manName').value){
    document.getElementById('manName').value = macs[0].model;
  }
  
  body.innerHTML = macs.map(function(m, i){
    return '<div class="mac-row">'+
      '<span class="seq">'+(i+1)+'</span>'+
      '<span class="mac">'+esc(m.mac)+'</span>'+
      '<span class="model">'+esc(m.model||'')+'</span>'+
    '</div>';
  }).join('');
  
  panel.style.display = '';
  toast('✅ 박스 '+boxno+' — '+macs.length+'개 모뎀 MAC 조회됨');
}

function copyMacList(){
  var boxno = document.getElementById('manBox').value.trim();
  if(!MAC_DATA) return;
  var macs = MAC_DATA[boxno] || MAC_DATA[String(parseInt(boxno,10))];
  if(!macs) return;
  var text = macs.map(function(m){return m.mac;}).join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      toast('📋 '+macs.length+'개 MAC 주소 복사됨');
    }).catch(function(){
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('📋 복사됨'); } catch(e){}
  document.body.removeChild(ta);
}

function esc(s){return String(s==null?'':s).replace(/[<>&"']/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}
</script>
</body>
</html>
